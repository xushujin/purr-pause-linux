<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>胖猫暂停一下（PurrPause） - 设置</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(160deg, #f4a460, #ff8c42);
            color: #3d2200;
            padding: 24px;
            user-select: none;
            overflow-y: auto;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }
        .section {
            background: rgba(255,255,255,0.92);
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .section + .section { margin-top: 14px; }
        h2 {
            font-size: 0.95rem;
            margin-bottom: 8px;
            color: #6b3a00;
        }
        .field {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            gap: 14px;
        }
        .field.column {
            display: block;
        }
        .field + .field { border-top: 1px solid rgba(244,164,96,0.2); }
        .field label {
            font-size: 0.9rem;
            color: #3d2200;
            font-weight: 500;
        }
        .field .hint {
            font-size: 0.75rem;
            color: #8b5e34;
            margin-top: 2px;
        }
        .field input[type="number"],
        .field input[type="text"],
        textarea {
            width: 70px;
            padding: 6px 10px;
            border: 1px solid #f4a460;
            border-radius: 8px;
            font-size: 0.95rem;
            text-align: center;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field input[type="text"] {
            width: 150px;
            text-align: left;
        }
        .field input.wide-input,
        textarea {
            width: 100%;
            margin-top: 8px;
            text-align: left;
        }
        textarea {
            min-height: 72px;
            resize: vertical;
            font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.82rem;
            line-height: 1.35;
            user-select: text;
        }
        .field input:focus,
        textarea:focus {
            border-color: #e07b20;
            box-shadow: 0 0 0 3px rgba(244,164,96,0.3);
        }
        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 16px;
        }
        button {
            padding: 8px 24px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.15s;
        }
        button:active { transform: scale(0.97); }
        .btn-save {
            background: #fff;
            color: #e07b20;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .btn-cancel {
            background: rgba(255,255,255,0.5);
            color: #6b3a00;
        }
        .status {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            font-size: 0.85rem;
            text-align: center;
            padding: 8px 24px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 100;
            pointer-events: none;
        }
        .status.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .status.success {
            background: rgba(34, 197, 94, 0.15);
            color: #16a34a;
        }
        .status.error {
            background: rgba(239, 68, 68, 0.15);
            color: #dc2626;
        }
        .field input.invalid {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }
        textarea.invalid {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }
        .btn-pick, .btn-clear {
            padding: 4px 12px;
            border: 1px solid #f4a460;
            border-radius: 6px;
            font-size: 0.8rem;
            background: #fff;
            color: #8b5e34;
            cursor: pointer;
        }
        .btn-clear {
            border-color: #ddd;
            color: #999;
        }
    </style>
</head>
<body>
    <h1>胖猫暂停一下（PurrPause） 设置</h1>
    <div class="section">
        <div class="field">
            <div>
                <label>屏幕使用时间</label>
                <div class="hint">连续使用多久后提醒休息</div>
            </div>
            <div><input type="number" id="thresholdMinutes" min="1" max="480"> 分钟</div>
        </div>
        <div class="field">
            <div>
                <label>休息时长</label>
                <div class="hint">每次休息持续多久</div>
            </div>
            <div><input type="number" id="breakMinutes" min="1" max="60"> 分钟</div>
        </div>
        <div class="field">
            <div>
                <label>动画模式</label>
                <div class="hint">猫咪出现的方式</div>
            </div>
            <div>
                <select id="animationMode" style="padding:6px 10px;border:1px solid #f4a460;border-radius:8px;font-size:0.9rem;outline:none;">
                    <option value="walk-zoom">右下角走出</option>
                    <option value="fade-center">中央淡入</option>
                    <option value="walk-flat">右侧走出</option>
                    <option value="walk-center">中央走出</option>
                </select>
            </div>
        </div>
        <div class="field">
            <div style="flex:1;min-width:0;">
                <label>素材目录</label>
                <div class="hint" id="webmDirHint" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">使用默认目录</div>
            </div>
            <div style="display:flex;gap:6px;align-items:center;flex-shrink:0;">
                <button class="btn-pick" id="pickDirBtn">选择</button>
                <button class="btn-clear" id="clearDirBtn">重置</button>
            </div>
        </div>
        <div class="field">
            <div>
                <label>开机自动启动</label>
                <div class="hint">系统启动时自动运行 胖猫暂停一下（PurrPause）</div>
            </div>
            <div>
                <input type="checkbox" id="autoLaunch" style="width:18px;height:18px;cursor:pointer;">
            </div>
        </div>
        <div class="field">
            <div>
                <label>运行日志</label>
                <div class="hint">记录运行信息到日志文件，用于排查问题（默认关闭）</div>
            </div>
            <div>
                <input type="checkbox" id="logEnabled" style="width:18px;height:18px;cursor:pointer;">
            </div>
        </div>
    </div>
    <div class="actions">
        <button class="btn-cancel" id="cancelBtn">取消</button>
        <button class="btn-save" id="saveBtn">保存</button>
    </div>
    <p class="status" id="status"></p>


    <script>
        const thresholdInput = document.getElementById('thresholdMinutes');
        const breakInput = document.getElementById('breakMinutes');
        const animationModeInput = document.getElementById('animationMode');
        const autoLaunchInput = document.getElementById('autoLaunch');
        const logEnabledInput = document.getElementById('logEnabled');
        const statusEl = document.getElementById('status');
        const webmDirHint = document.getElementById('webmDirHint');
        let customWebmDir = '';
        let isActivated = false;

        window.electronAPI.onLoadConfig((config) => {
            thresholdInput.value = config.thresholdMinutes || 45;
            breakInput.value = config.breakMinutes || 5;
            animationModeInput.value = config.animationMode || 'walk-center';
            customWebmDir = config.customWebmDir || '';
            isActivated = config._isActivated || false;
            autoLaunchInput.checked = config._autoLaunch || false;
            logEnabledInput.checked = config.logEnabled || false;
            webmDirHint.textContent = customWebmDir || '使用默认目录';

            if (!isActivated) {
                document.getElementById('pickDirBtn').disabled = true;
                document.getElementById('clearDirBtn').disabled = true;
                document.getElementById('pickDirBtn').style.opacity = '0.4';
                document.getElementById('clearDirBtn').style.opacity = '0.4';
                webmDirHint.textContent = '激活后可自定义素材目录';
                webmDirHint.style.color = '#999';

                animationModeInput.disabled = true;
                animationModeInput.style.opacity = '0.4';
                animationModeInput.style.cursor = 'not-allowed';
            }
        });

        window.electronAPI.onSaveConfigResult((result) => {
            if (result && result.success) {
                showStatus('保存成功 ✓', 'success');
            } else {
                showStatus((result && result.error) || '保存失败', 'error');
            }
        });

        document.getElementById('pickDirBtn').addEventListener('click', () => {
            if (!isActivated) return;
            window.electronAPI.pickWebmDir();
        });

        window.electronAPI.onWebmDirPicked((dir) => {
            customWebmDir = dir;
            webmDirHint.textContent = dir;
        });

        document.getElementById('clearDirBtn').addEventListener('click', () => {
            if (!isActivated) return;
            customWebmDir = '';
            webmDirHint.textContent = '使用默认目录';
        });

        function showStatus(msg, type) {
            statusEl.textContent = msg;
            statusEl.className = 'status ' + type + ' show';
            setTimeout(() => {
                statusEl.classList.remove('show');
            }, 2500);
        }

        function validate() {
            let valid = true;
            const threshold = parseInt(thresholdInput.value);
            const breakMin = parseInt(breakInput.value);

            thresholdInput.classList.remove('invalid');
            breakInput.classList.remove('invalid');

            if (!threshold || threshold < 1 || threshold > 480) {
                thresholdInput.classList.add('invalid');
                valid = false;
            }
            if (!breakMin || breakMin < 1 || breakMin > 60) {
                breakInput.classList.add('invalid');
                valid = false;
            }
            return valid;
        }

        thresholdInput.addEventListener('input', () => thresholdInput.classList.remove('invalid'));
        breakInput.addEventListener('input', () => breakInput.classList.remove('invalid'));

        document.getElementById('saveBtn').addEventListener('click', () => {
            if (!validate()) {
                showStatus('请检查时间设置', 'error');
                return;
            }
            const newConfig = {
                thresholdMinutes: parseInt(thresholdInput.value),
                breakMinutes: parseInt(breakInput.value),
                animationMode: animationModeInput.value,
                customWebmDir: customWebmDir,
                autoLaunch: autoLaunchInput.checked,
                logEnabled: logEnabledInput.checked
            };
            window.electronAPI.saveConfig(newConfig);
        });

        document.getElementById('cancelBtn').addEventListener('click', () => {
            window.electronAPI.closeSettings();
        });
    </script>
</body>
</html>
