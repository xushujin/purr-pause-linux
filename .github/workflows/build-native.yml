name: Build PurrPause Linux (Rust/GTK4)

# 触发策略：**只有打 v* tag 才会自动构建**。
# 推 main / PR 都不再触发 —— CI 只在正式发版时跑一次，
# 日常提交不会白白消耗构建时间，Actions 页面也不会堆出重复的 run。
# 代价：push 到 main 之后没有编译校验，破坏性改动要到打 tag 时才会暴露。
# 若想恢复「PR 上先校验、tag 才发版」，把 pull_request 段加回来即可。
on:
  push:
    tags:
      - 'v*'

  # 手动入口：不会自动触发；且手动跑时 github.ref 不是 tag，
  # 版本一致性检查与 release job 都会被跳过（只产出 artifact，不发版）。
  # 不需要的话，把下面这行一起删掉即可。
  workflow_dispatch:

# action 版本选择说明（勿凭"大版本号越大越新"随意改）：
# Node 20 运行时已于 2026 年移除，runner 会把老 action 强制跑在 Node 24 上并告警。
# 实测各版本的 runs.using（读 action.yml 得到，不是猜的）：
#   actions/checkout         v4=node20  v5/v6/v7=node24
#   actions/upload-artifact  v4=node20  v5=node20(!)  v6/v7=node24
#   actions/download-artifact v4/v5/v6=node20  v7/v8=node24
#   softprops/action-gh-release v2=node20  v3=node24
#   Swatinem/rust-cache      v2 已是 node24，无需改动
# 注意 upload-artifact 的 v5 与 download-artifact 的 v6 名义上是新大版本，
# 实际仍是 node20 —— 只有 v6+/v7+ 才切到 node24。
jobs:
  # ⚠️ 构建机必须是**最老的目标发行版**（22.04），不要改回 ubuntu-24.04。
  #
  # 原因一（硬性的）：glibc 符号版本只向下兼容 —— 老系统构建的产物能在新系统跑，
  #   反过来不行。在 24.04（glibc 2.39）上构建，二进制会带上 GLIBC_2.38 需求，
  #   22.04（glibc 2.35）上直接 `version 'GLIBC_2.38' not found` 起不来。
  #   这条与代码无关，改 Cargo.toml 也修不好，唯一解是换更老的构建环境。
  # 原因二：22.04 的 GTK 头文件是 4.6，与 features=["v4_6"] 天然一致，
  #   不会出现"编译期瞄到新符号、运行时才发现缺失"的情况。
  #
  # 代价：ubuntu-22.04 runner 迟早会被 GitHub 退役。届时**不能**简单换成
  #   ubuntu-24.04，而应改用 container: ubuntu:22.04（或在 24.04 上用
  #   docker run 跑 22.04 容器）。下方的「glibc 符号版本下限」步骤就是守卫。
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # 打 tag 发版时校验 tag 与项目版本号一致。
      # deb 的版本取自 native/Cargo.toml（build-deb.sh 从中读取 VERSION），
      # 与 git tag 之间**没有**自动关联：若打了 v1.0.1 却忘了改 Cargo.toml，
      # 会静默产出版本号仍为 1.0.0 的包，Release 里看起来就是错版本。
      - name: Tag / version consistency check
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -m1 '^version' native/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "tag = $GITHUB_REF_NAME    native/Cargo.toml 版本 = $ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v${tag} 与 native/Cargo.toml 的 ${ver} 不一致。请先同步版本号再打 tag。"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev \
            libssl-dev \
            librsvg2-bin imagemagick \
            desktop-file-utils dpkg-dev
          # 注意：**不装 libmpv-dev** —— 本应用不在链接期依赖 libmpv，
          # 而是运行时 dlopen（见 native/src/video.rs）。

      # 断言构建环境就是最老的目标发行版（22.04 / glibc 2.35）。
      #
      # 为什么值得单独一步：glibc 会渗透进构建产物的每个角落。
      # 实测踩过：rust-cache 的默认 key 只含 runner.os（“Linux”），**不含发行版版本**，
      # 于是 24.04 上缓存下来的 target/ 被恢复进了 22.04 的 job ——
      # 里面 aws-lc-sys 的 .o 是用 2.39 的头文件编的（引用 __isoc23_strtol），
      # 在 22.04 上直接 `undefined symbol: __isoc23_strtol` 链接失败。
      # 下面这个断言 + rust-cache 的显式 key 一起，把这类问题挡在开头。
      - name: 断言构建环境基线
        run: |
          set -euo pipefail
          echo "--- 构建环境 ---"
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          gcc --version | head -1
          ldd --version | head -1
          # rustc 此时可能尚未安装（由后面的 dtolnay/rust-toolchain 提供），仅记录
          rustc -V 2>/dev/null || echo "rustc: 尚未安装（稍后由 dtolnay/rust-toolchain 安装）"

          glibc_ver="$(ldd --version | head -1 | grep -oE '[0-9]+\.[0-9]+$')"
          echo "glibc = $glibc_ver （期望 2.35）"
          if [ "$glibc_ver" != "2.35" ]; then
            echo "::error::构建机 glibc 是 $glibc_ver，期望 2.35。构建机必须是最老的目标发行版 ubuntu-22.04，否则产物在 22.04 上会因 glibc 符号版本缺失而起不来。"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          # ⚠️ 这个 key 不能删。rust-cache 的默认缓存键只含 runner.os（“Linux”）、
          # rustc 版本和 Cargo.lock 哈希，**不含发行版版本** —— 于是
          # ubuntu-24.04 上缓存的 target/ 会被恢复进 ubuntu-22.04 的 job。
          # 那些 .o/.rlib 是用 glibc 2.39 的头文件编的（引用 __isoc23_strtol），
          # 在 22.04 上链接必然失败：`undefined symbol: __isoc23_strtol`。
          # 把构建环境写进 key，保证缓存与构建机版本严格对应。
          key: ubuntu-22.04

      # 序列号一致性校验。
      # fixtures.json 含私钥 seed，已 gitignore，因此公开仓库的 CI 跑的是
      # 「无密钥自检」分支：校验序列号解析顺序、验签链路与抗篡改。
      # 本地持有 fixtures.json 时会跑完整分支（含签名字节逐字节比对）。
      - name: License signature parity test
        run: |
          cd tools/sig-fixtures
          mkdir -p src
          cp verify.rs src/main.rs
          cargo run --quiet
          rm -rf src target Cargo.lock

      - name: Build
        working-directory: native
        run: ./build-deb.sh

      - name: Verify deb structure
        working-directory: native
        run: |
          set -euo pipefail
          DEB="$(ls dist/purr-pause-linux_*.deb | head -1)"
          echo "产物: $DEB"

          # 1) ar 成员名必须是标准名（dpkg 只认这些；带前导点的名字会被拒装）。
          #    注意压缩后缀是**变的**：Ubuntu 21.10 起 dpkg 默认用 zstd，
          #    产出 control.tar.zst / data.tar.zst；build-deb.sh 的 ar 回退
          #    路径（无 dpkg-deb 时，如 macOS）产出 .tar.gz。这里不能硬编码后缀。
          members="$(ar t "$DEB")"
          echo "--- ar 成员 ---"
          echo "$members"
          echo "$members" | grep -qx 'debian-binary' \
            || { echo "缺少成员: debian-binary"; exit 1; }
          echo "$members" | grep -qE '^control\.tar(\.[a-z]+)?$' \
            || { echo "缺少标准命名的 control.tar.* 成员"; exit 1; }
          echo "$members" | grep -qE '^data\.tar(\.[a-z]+)?$' \
            || { echo "缺少标准命名的 data.tar.* 成员"; exit 1; }

          # 2) 用 dpkg-deb 自身读取元数据 —— 它能透明处理 gz/xz/zst，
          #    且包结构不合法时直接报错，比手工 ar+tar 更可靠。
          echo "--- control 元数据 ---"
          dpkg-deb --field "$DEB" Package Version Architecture Depends

          # 3) 关键文件清单
          echo "--- 关键文件 ---"
          contents="$(dpkg-deb --contents "$DEB")"
          for f in \
            usr/bin/purr-pause-linux \
            usr/share/purr-pause-linux/config.json \
            usr/share/applications/purr-pause-linux.desktop \
            usr/share/icons/hicolor/scalable/apps/purr-pause-linux.svg ; do
            if echo "$contents" | grep -q "$f"; then
              echo "  OK  $f"
            else
              echo "缺少文件: $f"; exit 1
            fi
          done

          # 4) 内置 webm 素材必须打进包（否则猫咪动画不可用）
          n="$(echo "$contents" | grep -c '\.webm$' || true)"
          if [ "$n" -gt 0 ]; then
            echo "  OK  $n 个 webm 素材"
          else
            echo "deb 内没有 webm 素材"; exit 1
          fi

          echo "deb 结构校验通过"

      # 守卫：二进制的 glibc 符号版本需求不得超过最老的目标发行版。
      #
      # 这条检查是为了让「构建环境太新」这件事**在 CI 里当场暴露**，
      # 而不是等用户装到旧系统上才发现（glibc 符号缺失时程序连 main 都到不了）。
      # 22.04 = glibc 2.35。若换了构建环境，这里会立刻红。
      - name: 检查 glibc 符号版本下限
        working-directory: native
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          dpkg-deb -x dist/purr-pause-linux_*.deb "$tmp"
          bin="$tmp/usr/bin/purr-pause-linux"

          vers="$(objdump -T "$bin" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV || true)"
          echo "--- 二进制依赖的 glibc 符号版本 ---"
          echo "$vers"
          # 任何真实二进制都至少引用 GLIBC_2.2.5；读不到说明守卫本身失效了，
          # 这种"静默放行"比报错更危险，必须显式失败
          if [ -z "$vers" ]; then
            echo "::error::没能从二进制里读到 glibc 符号版本（objdump 失效？），此守卫未生效"
            exit 1
          fi
          echo "最高：$(echo "$vers" | sed 's/GLIBC_//' | sort -V | tail -1)"

          # 允许上限 2.35（Ubuntu 22.04）
          too_new="$(echo "$vers" | sed 's/GLIBC_//' | awk -F. '$1>2 || ($1==2 && $2>35)' | sort -uV)"
          if [ -n "$too_new" ]; then
            echo "::error::二进制需要 glibc $(echo "$too_new" | tr '\n' ' ')（超过 22.04 的 2.35）。构建环境太新了，必须用 ubuntu-22.04 构建。"
            exit 1
          fi
          echo "✓ 未超过 glibc 2.35"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: purr-pause-linux
          path: native/dist/purr-pause-linux_*.deb
          # 没匹配到文件就直接失败，避免"构建绿了但没产物"一路带到发版
          if-no-files-found: error

  # 在**干净**的 Ubuntu 22.04 容器里真实安装一次（无任何开发包）。
  #
  # 为什么需要独立一个 job：
  #   ① 干净环境才能验证 deb 的 Depends 是否写全 —— 构建机装了
  #      libgtk-4-dev 等开发包，在它上面装包会被"顺手满足"，掩盖漏写的依赖。
  #   ② 22.04 是最老的支持目标，它的 glibc / GTK / libadwaita 都是下限。
  #   ③ libmpv 是**运行时 dlopen**，不在 NEEDED 里，ldd 查不到，
  #      必须单独确认系统里确实有 libmpv.so.1 或 .so.2。
  verify-oldest:
    needs: [build-linux]
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: purr-pause-linux
          path: deb

      - name: Install on Ubuntu 22.04
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends ./deb/purr-pause-linux_*.deb

          echo "--- 已安装版本 ---"
          dpkg -s purr-pause-linux | sed -n '1,10p'

          echo "--- 动态库解析检查 ---"
          bin="$(command -v purr-pause-linux)"
          ldd "$bin" > /tmp/ldd.txt 2>&1 || true
          cat /tmp/ldd.txt
          # 解析不到的库会显示 "not found"；glibc 符号版本缺失也会命中这一关键字
          if grep -q "not found" /tmp/ldd.txt; then
            bad="$(grep "not found" /tmp/ldd.txt | head -5 | paste -sd' | ' -)"
            echo "::error::动态库依赖无法满足：$bad"
            exit 1
          fi

          echo "--- dlopen 目标 libmpv 是否存在 ---"
          # 视频是运行时 dlopen libmpv，不在 NEEDED 里，所以单独查一次
          if ldconfig -p | grep -qE 'libmpv\.so\.[12]'; then
            ldconfig -p | grep -E 'libmpv\.so\.[12]'
          else
            echo "::error::系统里没有 libmpv.so.1 / libmpv.so.2，视频功能不可用（检查 Depends）"
            exit 1
          fi

          echo "--- 关键运行时依赖的版本 ---"
          dpkg -s libgtk-4-1 libadwaita-1-0 | grep -E '^(Package|Version)'

          echo "✓ 在 Ubuntu 22.04 上安装并解析成功"

  # 同一份产物在最新的受支持发行版上也装一次。
  # 22.04 构建的产物按理能向前兼容，但"按理"要验证 —— 多数用户在 24.04+。
  # 直接装在 runner（本身就是 24.04）上，不用容器。
  verify-newest:
    needs: [build-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: purr-pause-linux
          path: deb

      - name: Install on Ubuntu 24.04
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y ./deb/purr-pause-linux_*.deb

          bin="$(command -v purr-pause-linux)"
          ldd "$bin" > /tmp/ldd.txt 2>&1 || true
          if grep -q "not found" /tmp/ldd.txt; then
            bad="$(grep "not found" /tmp/ldd.txt | head -5 | paste -sd' | ' -)"
            echo "::error::动态库依赖无法满足：$bad"
            exit 1
          fi

          ldconfig -p | grep -E 'libmpv\.so\.[12]' || {
            echo "::error::系统里没有 libmpv.so.1 / libmpv.so.2"; exit 1; }

          echo "✓ 在 Ubuntu 24.04 上安装并解析成功"

  # 仅打 v* tag 时运行，产出 GitHub Release 并附上 deb。
  # 保留 if 判断是因为手动触发（workflow_dispatch）时 github.ref 不是 tag，
  # 那种情况下只会产出 artifact，不会误发 Release。
  release:
    needs: [build-linux, verify-oldest, verify-newest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read # 下载 artifact 需要（一旦显式写 permissions，未列出的权限会变成 none）
    steps:
      # 指定 name 下载单个 artifact。注意 download-artifact 的目录规则：
      # 仅当**匹配到多个** artifact 时才会套一层同名子目录；
      # 只匹配到 1 个时（源码里的 `artifacts.length === 1` 分支）会直接解到 path 下。
      # 所以实际落地路径是 artifacts/purr-pause-linux_*.deb，而不是
      # artifacts/purr-pause-linux/purr-pause-linux_*.deb —— 之前就是这里写错，
      # 导致 files 通配匹配为空、Release 静默地只带着源码发布出去。
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: purr-pause-linux
          path: artifacts

      # 明确列出下载结果，出问题时一眼能看见；找不到 deb 直接失败。
      - name: Locate deb
        run: |
          set -euo pipefail
          echo "--- 下载到的文件 ---"
          find artifacts -type f | sort
          deb="$(find artifacts -name '*.deb' -type f | head -1)"
          if [ -z "$deb" ]; then
            echo "::error::artifact 内没有 .deb，请检查 build 阶段的 Upload artifact 步骤"
            exit 1
          fi
          echo "找到 deb: $deb"

      - uses: softprops/action-gh-release@v3
        with:
          # 用递归通配，三种布局（无子目录 / 有子目录 / 保留 native/dist 层级）都能命中
          files: artifacts/**/*.deb
          # 通配为空时直接报错 —— 这个 action 的默认值是 false，
          # 会在没有任何附件的情况下照样把 Release 建出来
          fail_on_unmatched_files: true
          generate_release_notes: true
