[package]
name = "purr-pause-linux"
version = "1.0.0"
edition = "2021"
description = "胖猫暂停一下（PurrPause Linux）- 一只胖猫提醒你适时休息"
license = "MIT"

[[bin]]
name = "purr-pause-linux"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_10"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
mpv = "0.2"
libloading = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs", "http2"] }
ed25519-dalek = "2"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
